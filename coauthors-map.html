<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="description" content="Map of Léonard Brice's co-authors, by country of origin.">
  <title>Léonard Brice — co-authors by country of origin</title>
  <link rel="icon" href="favicon.ico">

  <!-- Leaflet + TopoJSON -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson@3"></script>

  <style>
    /* The whole palette lives here; the script reads these values back. */
    :root {
      --sea:            #a9cfe3;
      --land:           #e3e3e3;
      --land-stroke:    #ffffff;
      --coauthor:       #4CAF50;
      --coauthor-hover: #66BB6A;
    }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: transparent;      /* blends with the embedding page */
      color: #333;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* The map fills the frame exactly, so the aspect ratio of the <iframe>
       in index.html is the aspect ratio of the map. */
    #map {
      width: 100%;
      height: 100%;
      background: var(--sea);       /* there is no basemap: this *is* the sea */
    }

    /* ---- legend (a Leaflet control, bottom left) ---- */
    .map-legend {
      background-color: rgba(255, 255, 255, 0.92);
      padding: 8px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      font-size: 12px;
      line-height: 1.4;
    }

    .legend-item {
      display: flex;
      align-items: center;
    }

    .legend-item + .legend-item { margin-top: 5px; }

    .legend-color-box {
      flex: none;
      width: 14px;
      height: 14px;
      margin-right: 7px;
      border-radius: 3px;
      border: 1px solid rgba(0, 0, 0, 0.15);
    }

    /* ---- popups ---- */
    .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }

    .popup-country {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .coauthor-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 13px;
    }

    .coauthor-list li {
      padding: 4px 0;
      color: #555;
      border-bottom: 1px solid #eee;
    }

    .coauthor-list li:last-child { border-bottom: none; }

    .coauthor-list a { color: #2e7d32; text-decoration: none; }
    .coauthor-list a:hover, .coauthor-list a:focus { text-decoration: underline; }

    .popup-none { margin: 6px 0 0 0; font-size: 12px; color: #999; }

    /* ---- hover tooltip ---- */
    .leaflet-tooltip.coauthor-tooltip {
      background-color: #fff;
      border: none;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    .leaflet-tooltip.coauthor-tooltip::before { display: none; }

    .noscript-note {
      padding: 16px;
      background: #fff;
      border-radius: 6px;
      font-size: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      .leaflet-fade-anim .leaflet-tile,
      .leaflet-zoom-anim .leaflet-zoom-animated { transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="map">
    <noscript>
      <p class="noscript-note">This map needs JavaScript. My co-authors come from Austria, Belgium,
      France, Germany, India, Iran, Peru and the Spanish state.</p>
    </noscript>
  </div>

<script>
(function () {
  'use strict';

  /* ==================================================================
     Data
     ================================================================== */

  const coauthorsByCountry = {
    "056": [{name: "Jean-François Raskin", url: "https://verif.ulb.ac.be/jfr/"}],
    "250": [{name: "Marie van den Bogaard", url: "https://pagespro.univ-gustave-eiffel.fr/marie-van-den-bogaard"},
            {name: "Mathieu Sassolas"},
            {name: "Guillaume Scerri", url: "https://lmf.cnrs.fr/GuillaumeScerri/HomePage"}],
    "040": [{name: "Thomas A. Henzinger", url: "https://pub.ista.ac.at/~tah/"}],
    "276": [{name: "Thomas Bruss", url: "https://cvchercheurs.ulb.ac.be/Siteprev/Compos/DESC3541.php"}],
    "356": [{name: "Anirban Majumdar", url: "https://anirban11.github.io/"},
            {name: "K. S. Thejaswini", url: "https://thejaswiniraghavan.github.io/"},
            {name: "Krishnendu Chatterjee", url: "https://pub.ista.ac.at/~kchatterjee/"}],
    "724": [{name: "Filip Cano Cordoba (Catalunya)", url: "https://filipcano.org/"}],
    "604": [{name: "Stefanie Muroya Lei", url: "https://research-explorer.ista.ac.at/person/a376de31-8972-11ed-ae7b-d0251c13c8ff"}],
    "364": [{name: "Ali Asadi", url: "https://ali-asadi.com/"},
            {name: "Alipasha Montaseri"},
            {name: "Ali Shafiee"}]
  };

  const countryNames = {
    "056": "Belgium",
    "250": "France",
    "040": "Austria",
    "276": "Germany",
    "724": "Spanish state",
    "356": "India",
    "604": "Peru",
    "364": "Iran"
  };

  const css = getComputedStyle(document.documentElement);
  const token = (name, fallback) => (css.getPropertyValue(name).trim() || fallback);

  const colors = {
    active: token('--coauthor', '#4CAF50'),
    hover:  token('--coauthor-hover', '#66BB6A'),
    land:   token('--land', '#e3e3e3'),
    stroke: token('--land-stroke', '#ffffff')
  };

  /* ==================================================================
     Antimeridian handling

     A GeoJSON ring is a list of vertices (lng_i, lat_i) that the renderer
     joins by straight segments in the (lng, lat) plane. Countries that
     cross the 180th meridian (Russia, Fiji, New Zealand, the US, ...) are
     stored either with a jump |lng_{i+1} - lng_i| > 180, in which case the
     segment is drawn the long way round and paints a stripe across the
     whole map, or with longitudes outside [-180, 180], in which case the
     piece is drawn off-map. Both are fixed here in three steps:

       1. unwrap: rebuild longitudes so that every step is the increment
          taken modulo 360 in [-180, 180]. The polyline is now the intended
          one, but it may live outside [-180, 180].
       2. clip: intersect it with each vertical strip
          S_k = [360k - 180, 360k + 180] that it meets. A strip is convex,
          so Sutherland-Hodgman clipping is exact for the filled region.
       3. translate: shift the piece obtained for k by -360k.

     Rings that wind around the globe (Antarctica) admit no unwrapping;
     they are detected and left untouched, which is what the renderer wants.
     ================================================================== */

  function ensureClosed(ring) {
    const f = ring[0], l = ring[ring.length - 1];
    return (f[0] === l[0] && f[1] === l[1]) ? ring : ring.concat([[f[0], f[1]]]);
  }

  function unwrapRing(ring) {
    const r = ensureClosed(ring);
    const out = [[r[0][0], r[0][1]]];
    for (let i = 1; i < r.length; i++) {
      let d = r[i][0] - r[i - 1][0];
      d -= 360 * Math.round(d / 360);
      out.push([out[i - 1][0] + d, r[i][1]]);
    }
    // Winds around the globe (Antarctica): leave it alone.
    if (Math.abs(out[out.length - 1][0] - out[0][0]) > 1e-6) return null;
    return out;
  }

  // Sutherland-Hodgman against one half-plane: keepLeft ? {x <= c} : {x >= c}.
  function clipHalfPlane(ring, keepLeft, c) {
    const inside = p => keepLeft ? p[0] <= c : p[0] >= c;
    const out = [];
    for (let i = 0; i < ring.length; i++) {
      const cur = ring[i], nxt = ring[(i + 1) % ring.length];
      const curIn = inside(cur), nxtIn = inside(nxt);
      if (curIn) out.push(cur);
      if (curIn !== nxtIn) {
        const t = (c - cur[0]) / (nxt[0] - cur[0]);
        out.push([c, cur[1] + t * (nxt[1] - cur[1])]);
      }
    }
    return out;
  }

  function clipToStrip(ring, lo, hi) {
    let r = ring;
    const f = r[0], l = r[r.length - 1];
    if (f[0] === l[0] && f[1] === l[1]) r = r.slice(0, -1);   // drop closing vertex
    r = clipHalfPlane(r, false, lo);
    if (r.length === 0) return r;
    r = clipHalfPlane(r, true, hi);
    if (r.length === 0) return r;
    return ensureClosed(r);
  }

  // rings = [exterior, hole, hole, ...]  ->  list of such polygons
  function splitPolygon(rings) {
    const unwrapped = rings.map(unwrapRing);
    if (unwrapped.some(r => r === null)) return [rings];

    let a = Infinity, b = -Infinity;
    for (const p of unwrapped[0]) {
      if (p[0] < a) a = p[0];
      if (p[0] > b) b = p[0];
    }
    if (a >= -180 && b <= 180) return [rings];               // nothing to do

    const kmin = Math.ceil((a - 180) / 360);
    const kmax = Math.floor((b + 180) / 360);
    const polygons = [];
    for (let k = kmin; k <= kmax; k++) {
      const lo = 360 * k - 180, hi = 360 * k + 180;
      const clipped = unwrapped
        .map(r => clipToStrip(r, lo, hi))
        .filter((r, i) => i === 0 || r.length >= 4);         // drop empty holes
      if (clipped[0].length < 4) continue;                   // absent from this strip
      polygons.push(clipped.map(r => r.map(p => [p[0] - 360 * k, p[1]])));
    }
    return polygons.length ? polygons : [rings];
  }

  // One feature per country, so one Leaflet layer, one popup, one hover.
  function fixAntimeridian(features) {
    return features.map(feature => {
      const g = feature.geometry;
      if (!g) return feature;
      let polys;
      if (g.type === 'Polygon') polys = [g.coordinates];
      else if (g.type === 'MultiPolygon') polys = g.coordinates;
      else return feature;

      const out = [];
      for (const rings of polys) for (const p of splitPolygon(rings)) out.push(p);

      return {
        type: 'Feature',
        id: feature.id,
        properties: feature.properties,
        geometry: { type: 'MultiPolygon', coordinates: out }
      };
    });
  }

  /* ==================================================================
     Map
     ================================================================== */

  // The latitudes the frame is meant to show: just above Cape Chelyuskin
  // (77°43'N, northernmost coast of continental Asia) and just below Cape
  // Horn (55°59'S). Nothing is removed from the data -- zooming or panning
  // out still shows the Arctic and Antarctica.
  const VIEW = { north: 78.5, south: -57 };

  const map = L.map('map', {
    renderer: L.canvas(),
    zoomSnap: 0,                     // the fitting zoom below is fractional
    zoomDelta: 0.5,
    minZoom: 0,
    maxZoom: 8,
    worldCopyJump: false,
    scrollWheelZoom: false,          // re-enabled once the map is clicked
    maxBounds: [[-85, -180], [85, 180]],
    maxBoundsViscosity: 0.5
  });

  // No tile basemap at all: the country polygons below are the whole map, so
  // there are no place names, no repeated copies of the world, and the sea is
  // simply the #map background colour (--sea).
  //
  // If you ever want tiles back, add for instance a label-free Carto layer:
  //   L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png', {
  //     attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  //     subdomains: 'abcd', noWrap: true, bounds: [[-90, -180], [90, 180]]
  //   }).addTo(map);
  map.attributionControl.addAttribution(
    'Boundaries: <a href="https://www.naturalearthdata.com/">Natural Earth</a>');

  // Legend, in the corner of the map rather than under it: it costs no
  // vertical space on the page that way.
  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'map-legend');
    div.innerHTML =
      '<div class="legend-item">' +
        '<span class="legend-color-box" style="background-color: var(--coauthor);"></span>' +
        '<span>Countries with coauthors</span></div>' +
      '<div class="legend-item">' +
        '<span class="legend-color-box" style="background-color: var(--land);"></span>' +
        '<span>Other countries</span></div>';
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  legend.addTo(map);

  // Show the whole world edge to edge, and centre it on the middle of the
  // latitude band above. The frame is short enough (see the aspect ratio of
  // .map-frame in index.html) that the poles fall outside it; they are still
  // there, one zoom-out or one drag away.
  let framing = false, userMoved = false;

  function bandCentre() {
    const n = map.project(L.latLng(VIEW.north, 0), 0);
    const s = map.project(L.latLng(VIEW.south, 0), 0);
    return map.unproject(L.point(n.x, (n.y + s.y) / 2), 0).lat;
  }

  function frameWorld() {
    framing = true;
    const width = map.getSize().x || 860;     // frame not laid out yet
    map.setView([bandCentre(), 0], Math.log2(width / 256), { animate: false });
    framing = false;
  }

  map.on('zoomstart dragstart', function () { if (!framing) userMoved = true; });
  map.on('resize', function () { if (!userMoved) frameWorld(); });
  frameWorld();

  // Don't steal the page's scroll; wake up on a click.
  map.on('click', function () { map.scrollWheelZoom.enable(); });
  map.getContainer().addEventListener('mouseleave', function () {
    map.scrollWheelZoom.disable();
  });

  // Same idea for one-finger panning on touch screens.
  if (L.Browser.mobile) {
    map.dragging.disable();
    map.on('click', function () { map.dragging.enable(); });
  }

  function getCountryCode(feature) {
    return feature.id ? String(feature.id).padStart(3, '0') : null;
  }

  function popupHtml(name, coauthors) {
    let html = '<strong class="popup-country">' + name + '</strong>';
    if (coauthors) {
      html += '<ul class="coauthor-list">';
      coauthors.forEach(function (c) {
        html += '<li>' + (c.url
          ? '<a href="' + c.url + '" target="_blank" rel="noopener">' + c.name + '</a>'
          : c.name) + '</li>';
      });
      html += '</ul>';
    } else {
      html += '<p class="popup-none">No coauthors</p>';
    }
    return html;
  }

  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json')
    .then(function (response) { return response.json(); })
    .then(function (data) {
      let features = topojson.feature(data, data.objects.countries).features;

      // Split the rings that cross the 180th meridian (Russia, Fiji, ...)
      features = fixAntimeridian(features);

      L.geoJSON(features, {
        style: function (feature) {
          const hasCoauthors = !!coauthorsByCountry[getCountryCode(feature)];
          return {
            fillColor: hasCoauthors ? colors.active : colors.land,
            fillOpacity: 1,              // opaque: nothing underneath to blend with
            color: colors.stroke,
            weight: hasCoauthors ? 1 : 0.8,
            opacity: 1
          };
        },
        onEachFeature: function (feature, layer) {
          const code = getCountryCode(feature);
          const name = countryNames[code] || feature.properties.name;
          const coauthors = coauthorsByCountry[code];

          layer.bindPopup(popupHtml(name, coauthors));

          if (coauthors) {
            const n = coauthors.length;
            layer.bindTooltip(name + ' — ' + n + (n > 1 ? ' co-authors' : ' co-author'),
                              { sticky: true, className: 'coauthor-tooltip' });
            layer.on('mouseover', function () {
              this.setStyle({ fillColor: colors.hover, weight: 2 });
            });
            layer.on('mouseout', function () {
              this.setStyle({ fillColor: colors.active, weight: 1 });
            });
          }
        }
      }).addTo(map);
    })
    .catch(function (error) { console.error('Error loading map data:', error); });
})();
</script>
</body>
</html>
